{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h4>Criar administrador</h4>
  {% for msg in get_flashed_messages() %}
    <div class="alert alert-warning">{{ msg }}</div>
  {% endfor %}
  <form method="post">
    <input class="form-control mb-2" name="username" placeholder="Usuário" required>
    <input class="form-control mb-2" type="password" name="password" placeholder="Senha" required>
    <input class="form-control mb-3" type="password" name="confirm" placeholder="Confirmar senha" required>
    <button class="btn btn-primary w-100">Criar</button>
  </form>
</div>
{% endblock %}
